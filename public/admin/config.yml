# ---------------------------------------------------------------------------
# Admin configuration.
#
# ONE THING TO CHANGE BEFORE DEPLOYING:
#   backend.repo -> your GitHub "username/repository"
#
# base_url points at this same site — the login is handled by two small
# functions in netlify/functions/ (auth.mts and callback.mts), so there is no
# third service to sign up for. (now just updating)
# ---------------------------------------------------------------------------

backend:
  name: github
  repo: crseibaek/timpanduro-site
  branch: main
  base_url: https://timpanduro.com
  auth_endpoint: auth
  # Saving does not rebuild the site: every save gets "[skip ci]" in its commit
  # message, which Netlify skips. Use "Publish Changes" in the admin header to
  # deploy everything saved since the last publish in one go (one deploy, 15
  # Netlify credits). It needs the Netlify build hook URL pasted once under
  # Account → Settings → Advanced in the admin. Deleting an entry still deploys.
  skip_ci: true

# Where uploaded stills are stored.
media_folder: public/thumbs
public_folder: /thumbs

locale: en

collections:
  # -------------------------------------------------------------------------
  # 1. The catalogue. One entry per production.
  # -------------------------------------------------------------------------
  - name: productions
    label: Productions
    label_singular: Production
    folder: src/content/productions
    create: true
    slug: '{{title}}'
    identifier_field: title
    summary: '{{title}} — {{client}} ({{year}})'
    sortable_fields: ['order', 'year', 'title']
    view_filters:
      - { label: Stage, field: categories, pattern: stage }
      - { label: Cinema, field: categories, pattern: cinema }
      - { label: Documentary, field: categories, pattern: documentary }
      - { label: Commercial, field: categories, pattern: commercial }
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Client, name: client, widget: string, required: false }
      - { label: Year, name: year, widget: number, value_type: int, min: 1990, max: 2100 }
      # The ids must match src/data/categories.ts — the build stops if they don't.
      - label: Categories
        name: categories
        widget: select
        multiple: true
        min: 1
        hint: 'Pick at least one. A production can be in several.'
        options:
          - { label: Stage, value: stage }
          - { label: Cinema, value: cinema }
          - { label: Documentary, value: documentary }
          - { label: Commercial, value: commercial }
      - { label: Role, name: role, widget: string, required: false, hint: 'E.g. "Camera & edit"' }
      - { label: Description, name: description, widget: text, required: false }
      - label: 'Vimeo ID'
        name: vimeoId
        widget: string
        required: false
        hint: 'Only the digits from vimeo.com/123456789 — so 123456789'
      - label: Still
        name: thumbnail
        widget: image
        required: false
        hint: 'Optional. Without an image, Vimeo''s own thumbnail is used.'
      - label: Order
        name: order
        widget: number
        value_type: int
        default: 999
        hint: 'Lower numbers come first on the wall. Leave at 999 to place it last.'
      - { label: Featured, name: featured, widget: boolean, default: false, required: false }
      - { label: 'Draft (not shown)', name: draft, widget: boolean, default: false, required: false }

  # -------------------------------------------------------------------------
  # 2. Offer pages. One entry becomes one /offers/<customer> page.
  # -------------------------------------------------------------------------
  - name: offers
    label: Offer pages
    label_singular: Offer page
    folder: src/content/offers
    create: true
    slug: '{{customer}}'
    identifier_field: customer
    summary: '{{customer}} — {{date}}'
    sortable_fields: ['date', 'customer']
    fields:
      - label: Customer
        name: customer
        widget: string
        hint: 'The name also becomes the address. "City Museum" gives /offers/city-museum'
      - { label: Date, name: date, widget: datetime, date_format: 'DD-MM-YYYY', time_format: false }
      - { label: Headline, name: headline, widget: string, required: false }
      - label: 'Your message'
        name: intro
        widget: text
        hint: 'Write it like an email. Blank line between paragraphs.'
      - label: 'Selected films'
        name: productions
        widget: relation
        collection: productions
        multiple: true
        value_field: '{{slug}}'
        search_fields: ['title', 'client']
        display_fields: ['title', 'year']
        hint: 'Search and pick. The order here is the order on the page.'
      - { label: 'Closing line', name: outro, widget: string, required: false }
      - { label: Published, name: published, widget: boolean, default: true }

  # -------------------------------------------------------------------------
  # 3. Site settings — name and contact details.
  # -------------------------------------------------------------------------
  - name: settings
    label: Settings
    files:
      - name: site
        label: 'Name and contact'
        file: src/data/site.json
        fields:
          - { label: Name, name: name, widget: string }
          - { label: E-mail, name: email, widget: string }
          - { label: Phone, name: phone, widget: string, required: false }
          - { label: CVR, name: cvr, widget: string, required: false }
          - { label: 'Vimeo profile', name: vimeo, widget: string, required: false }
          - { label: Instagram, name: instagram, widget: string, required: false }
          - { label: LinkedIn, name: linkedin, widget: string, required: false }
